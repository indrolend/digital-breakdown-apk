import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def repositoryRoot = rootProject.projectDir.parentFile
def versionManifest = new JsonSlurper().parse(new File(repositoryRoot, 'version.json'))
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
def publicVersionName = versionManifest.releaseStage == 'stable'
        ? versionManifest.gameVersion
        : "${versionManifest.gameVersion}-${versionManifest.releaseStage}"
def androidVersionCode = (versionManifest.androidVersionCodeBase as int) + buildNumber

android {
    namespace 'com.indrolend.digitalbreakdown'
    compileSdk 36
    ndkVersion '27.2.12479018'
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDirs += ['../../native-tv-gifs'] } }

    defaultConfig {
        applicationId 'com.indrolend.digitalbreakdown.native'
        minSdk 27
        targetSdk 35
        versionCode androidVersionCode
        versionName publicVersionName
        buildConfigField 'String', 'GAME_VERSION', '"' + versionManifest.gameVersion + '"'
        buildConfigField 'String', 'RELEASE_STAGE', '"' + versionManifest.releaseStage + '"'
        buildConfigField 'int', 'BUILD_NUMBER', buildNumber.toString()
        buildConfigField 'int', 'PROTOCOL_VERSION', versionManifest.protocolVersion.toString()
        buildConfigField 'int', 'SAVE_SCHEMA_VERSION', versionManifest.saveSchemaVersion.toString()
        buildConfigField 'String', 'MULTIPLAYER_URL', '"' + (System.getenv('DIGITAL_BREAKDOWN_MULTIPLAYER_URL') ?: 'https://digital-breakdown-multiplayer.indrolend.workers.dev') + '"'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
                arguments "-DDIGITAL_BREAKDOWN_BUILD_NUMBER=${buildNumber}",
                          "-DDIGITAL_BREAKDOWN_SOURCE_COMMIT=${System.getenv('GITHUB_SHA') ?: 'unknown'}"
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    def ciKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def ciKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def ciKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def ciKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
    def hasCiSigning = ciKeystorePath && ciKeystorePassword && ciKeyAlias && ciKeyPassword

    if (hasCiSigning) {
        signingConfigs {
            ciRelease {
                storeFile file(ciKeystorePath)
                storePassword ciKeystorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.ciRelease
                minifyEnabled false
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
}
