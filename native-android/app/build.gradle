apply plugin: 'com.android.application'

android {
    namespace 'com.indrolend.digitalbreakdown'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.indrolend.digitalbreakdown.native'
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName '0.1-native'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    def ciKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def ciKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def ciKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def ciKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
    def hasCiSigning = ciKeystorePath && ciKeystorePassword && ciKeyAlias && ciKeyPassword

    if (hasCiSigning) {
        signingConfigs {
            ciRelease {
                storeFile file(ciKeystorePath)
                storePassword ciKeystorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.ciRelease
                minifyEnabled false
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {}
