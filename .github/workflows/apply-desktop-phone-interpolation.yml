name: Apply desktop phone interpolation

on:
  push:
    branches:
      - desktop-smoothness-pass
    paths:
      - tools/apply_desktop_phone_interpolation.py
      - .github/workflows/apply-desktop-phone-interpolation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-smoothness-pass
          fetch-depth: 0
      - name: Apply input consumption transform if needed
        run: |
          if ! grep -q 'submitSimulationInput(simulationSteps == 0)' native-desktop/main.cpp; then
            python3 tools/apply_desktop_input_consumption.py
          fi
      - name: Apply phone interpolation transform
        run: python3 tools/apply_desktop_phone_interpolation.py
      - name: Verify transformed source
        run: |
          grep -q 'submitSimulationInput(simulationSteps == 0)' native-desktop/main.cpp
          grep -q 'previousPhoneTransform' native-desktop/main.cpp
          grep -q 'quatSlerp(previousPhoneTransform.orientation' native-desktop/main.cpp
          grep -q 'renderState.player.pos' native-desktop/main.cpp
      - name: Commit transformed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-desktop/main.cpp
          git commit -m 'Interpolate desktop player phone transform'
          git push origin HEAD:desktop-smoothness-pass