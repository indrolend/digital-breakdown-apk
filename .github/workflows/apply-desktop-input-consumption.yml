name: Apply desktop input consumption fix

on:
  push:
    branches:
      - desktop-smoothness-pass
    paths:
      - tools/apply_desktop_input_consumption.py
      - .github/workflows/apply-desktop-input-consumption.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-smoothness-pass
          fetch-depth: 0
      - name: Apply guarded transform
        run: python3 tools/apply_desktop_input_consumption.py
      - name: Verify transformed source
        run: |
          grep -q 'submitSimulationInput(simulationSteps == 0)' native-desktop/main.cpp
          grep -q 'pendingJumpPressed' native-desktop/main.cpp
          grep -q 'host.lookX = 0.0' native-desktop/main.cpp
      - name: Commit transformed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-desktop/main.cpp
          git commit -m 'Consume desktop look input on simulation steps'
          git push origin HEAD:desktop-smoothness-pass
