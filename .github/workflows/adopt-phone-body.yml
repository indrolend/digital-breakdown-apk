name: Adopt phone body contract

on:
  push:
    branches:
      - agent/phone-body-adoption

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adoption branch
        uses: actions/checkout@v4
        with:
          ref: agent/phone-body-adoption
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded phone body adoption
        run: python3 tools/apply_phone_body_adoption.py --write

      - name: Verify focused transform state
        run: python3 tools/apply_phone_body_adoption.py --check

      - name: Verify gameplay
        run: bash scripts/verify-gameplay.sh

      - name: Commit runtime adoption
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/app/src/main/cpp/game/Game.cpp
          git commit -m "Adopt canonical phone body geometry"
          git push origin HEAD:agent/phone-body-adoption
