name: Finalize authoritative snapshot ownership

on:
  push:
    branches:
      - agent/ownership-contracts-settings
    paths:
      - .github/workflows/finalize-authoritative-snapshot-ownership.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ownership-contracts-settings
          fetch-depth: 0
      - name: Apply deterministic ownership batch
        run: python3 tools/finalize_authoritative_snapshot_ownership.py
      - name: Verify gameplay contracts
        run: bash scripts/verify-gameplay.sh
      - name: Verify protocol consistency
        run: node tools/release/protocol-consistency.mjs
      - name: Commit ownership batch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-network/MultiplayerProtocol.hpp \
                  native-network/MultiplayerProtocol.cpp \
                  native-desktop/DesktopMultiplayer.cpp \
                  native-desktop/main.cpp \
                  native-android/app/src/main/cpp/native_bridge.cpp \
                  native/tests/multiplayer_protocol_test.cpp \
                  tools/check_ownership_boundaries.py
          git commit -m "Own authoritative snapshot application in protocol"
          git push origin HEAD:agent/ownership-contracts-settings
