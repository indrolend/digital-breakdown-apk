name: Finalize local preferences batch

on:
  push:
    branches:
      - agent/ownership-contracts-settings
    paths:
      - .github/workflows/finalize-local-preferences-batch.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ownership-contracts-settings
          fetch-depth: 0
      - name: Apply deterministic ownership batch
        run: python3 tools/finalize_local_preferences_batch.py
      - name: Verify gameplay contracts
        run: bash scripts/verify-gameplay.sh
      - name: Commit ownership batch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/app/src/main/cpp/game/Game.hpp \
                  native-desktop/main.cpp \
                  native-android/app/src/main/cpp/native_bridge.cpp \
                  native/tests/gameplay_state_contracts_test.cpp \
                  scripts/verify-gameplay.sh \
                  scripts/verify-gameplay.ps1 \
                  tools/apply_local_settings_ownership.py
          git commit -m "Separate local preferences from session state"
          git push origin HEAD:agent/ownership-contracts-settings
