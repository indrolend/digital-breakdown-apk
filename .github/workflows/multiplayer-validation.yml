name: Desktop Lighting Visual Proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-abc-visual-proof:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture A B C sequences
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $refs = @(
            @{ Name = 'A-base'; Ref = '86066c3c20879d2b3cc2b84bfc536869d3dc9a99' },
            @{ Name = 'B-sun-contract'; Ref = '4f6f9c0530b75407074e1b56851ef85e377789ef' },
            @{ Name = 'C-current-camera'; Ref = 'b76953e4cf0efa5238a60d3dcace8aa71f16cdc8' }
          )
          New-Item -ItemType Directory -Force visual-proof | Out-Null
          foreach ($item in $refs) {
            Write-Host "=== $($item.Name) $($item.Ref) ==="
            git checkout --force $item.Ref
            cmake -S native-desktop -B build/visual-proof -A x64 `
              -DDB_COMMIT_SHA="$($item.Ref)" `
              -DDB_CHANNEL="visual-proof" `
              -DDB_HUMAN_VERSION="visual-proof"
            cmake --build build/visual-proof --config Release --parallel
            $exe = Resolve-Path 'build/visual-proof/bin/Release/DigitalBreakdown.exe'
            $out = Join-Path (Resolve-Path 'visual-proof') $item.Name
            New-Item -ItemType Directory -Force $out | Out-Null
            & $exe --capture-cinematic-demo $out --capture-width 320 --capture-height 180 --capture-hide-hud
            if ($LASTEXITCODE -ne 0) { throw "capture failed for $($item.Name): exit $LASTEXITCODE" }
            $frames = @(Get-ChildItem $out -Filter '*.ppm' | Sort-Object Name)
            if ($frames.Count -lt 2) { throw "insufficient frames for $($item.Name): $($frames.Count)" }
            Write-Host "CAPTURE_COUNT $($item.Name)=$($frames.Count)"
          }

      - name: Compare frame pixels
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib, statistics

          root = Path('visual-proof')
          labels = ['A-base', 'B-sun-contract', 'C-current-camera']

          def read_ppm(path):
              data = path.read_bytes()
              if not data.startswith(b'P6'):
                  raise RuntimeError(f'not P6: {path}')
              pos = 2
              tokens = []
              while len(tokens) < 3:
                  while pos < len(data) and data[pos] in b' \t\r\n': pos += 1
                  if data[pos:pos+1] == b'#':
                      while pos < len(data) and data[pos] not in b'\r\n': pos += 1
                      continue
                  start = pos
                  while pos < len(data) and data[pos] not in b' \t\r\n': pos += 1
                  tokens.append(data[start:pos])
              while pos < len(data) and data[pos] in b' \t\r\n': pos += 1
              w, h, maxv = map(int, tokens)
              pixels = data[pos:]
              if maxv != 255 or len(pixels) != w*h*3:
                  raise RuntimeError(f'bad ppm payload: {path} {w}x{h} {len(pixels)}')
              return w, h, pixels

          frames = {label: sorted((root/label).glob('*.ppm')) for label in labels}
          counts = {k: len(v) for k,v in frames.items()}
          print('FRAME_COUNTS', counts)
          if len(set(counts.values())) != 1:
              raise SystemExit('frame-count mismatch')

          def compare(left, right):
              maes=[]; changed=[]; maxima=[]; exact=0
              rows=[]
              for lp, rp in zip(frames[left], frames[right]):
                  lw,lh,a=read_ppm(lp); rw,rh,b=read_ppm(rp)
                  if (lw,lh)!=(rw,rh): raise SystemExit('dimension mismatch')
                  diffs=[abs(x-y) for x,y in zip(a,b)]
                  mae=sum(diffs)/len(diffs)
                  ch=sum(d != 0 for d in diffs)
                  mx=max(diffs) if diffs else 0
                  if ch==0: exact += 1
                  maes.append(mae); changed.append(ch); maxima.append(mx)
                  rows.append((mae, ch, mx, lp.name))
              rows.sort(reverse=True)
              return {
                  'frames': len(maes), 'exact_frames': exact,
                  'mean_mae': statistics.fmean(maes), 'max_frame_mae': max(maes),
                  'mean_changed_channels': statistics.fmean(changed),
                  'max_channel_delta': max(maxima), 'worst': rows[:10]
              }

          ab=compare('A-base','B-sun-contract')
          bc=compare('B-sun-contract','C-current-camera')
          ac=compare('A-base','C-current-camera')
          print('A_VS_B', ab)
          print('B_VS_C', bc)
          print('A_VS_C', ac)

          summary = root/'comparison.txt'
          summary.write_text(f'FRAME_COUNTS {counts}\nA_VS_B {ab}\nB_VS_C {bc}\nA_VS_C {ac}\n', encoding='utf-8')

          # Preserve a compact set of diagnostic frames around the largest B/C deltas.
          worst_names=[row[3] for row in bc['worst'][:6]]
          selected=root/'selected'
          selected.mkdir(exist_ok=True)
          for label in labels:
              for name in worst_names:
                  src=root/label/name
                  if src.exists():
                      (selected/f'{label}__{name}').write_bytes(src.read_bytes())
          print('SELECTED_FRAMES', worst_names)
          '@ | Set-Content -Encoding UTF8 compare_visuals.py
          python compare_visuals.py

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lighting-abc-visual-proof
          path: |
            visual-proof/comparison.txt
            visual-proof/selected/*.ppm
          if-no-files-found: warn
          retention-days: 7
