name: Desktop Lighting Visual Proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux-abc-visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install software OpenGL runtime
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          timeout 90s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=10 update
          timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=10 install -y \
            xvfb mesa-utils libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Prove software OpenGL
        shell: bash
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 640x480x24' glxinfo -B

      - name: Capture A B C sequences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          while read -r label ref; do
            echo "=== $label $ref ==="
            git checkout --force "$ref"
            python3 - <<'PY'
          from pathlib import Path
          path = Path('native-desktop/main.cpp')
          text = path.read_text()
          gl_old = '''#elif defined(__APPLE__)
          #define GL_SILENCE_DEPRECATION
          #include <OpenGL/gl.h>
          #endif'''
          gl_new = '''#elif defined(__APPLE__)
          #define GL_SILENCE_DEPRECATION
          #include <OpenGL/gl.h>
          #else
          #include <GL/gl.h>
          #endif'''
          if text.count(gl_old) != 1:
              raise SystemExit(f'expected exactly one main.cpp GL include anchor, got {text.count(gl_old)}')
          text = text.replace(gl_old, gl_new, 1)
          glfw_anchor = '#include <GLFW/glfw3.h>\n'
          linux_stubs = '''#include <GLFW/glfw3.h>

          #if !defined(_WIN32) && !defined(__APPLE__)
          extern "C" void controllerRumblePulse(float, float, int) {}
          extern "C" void controllerRumbleUpdate() {}
          extern "C" void controllerRumbleStop() {}
          extern "C" void touchpadHapticPulse(TouchpadHapticEffect, int) {}
          #endif
          '''
          if text.count(glfw_anchor) != 1:
              raise SystemExit(f'expected exactly one GLFW include anchor, got {text.count(glfw_anchor)}')
          path.write_text(text.replace(glfw_anchor, linux_stubs, 1))
          PY
            git diff --check -- native-desktop/main.cpp
            git diff -- native-desktop/main.cpp | tee "visual-proof/$label-linux-shim.log"

            rm -rf build/visual-proof
            cmake -S native-desktop -B build/visual-proof \
              -DCMAKE_BUILD_TYPE=Release \
              -DGLFW_BUILD_WAYLAND=OFF \
              -DDB_COMMIT_SHA="$ref" \
              -DDB_CHANNEL=visual-proof \
              -DDB_HUMAN_VERSION=visual-proof \
              2>&1 | tee "visual-proof/$label-configure.log"
            cmake --build build/visual-proof --config Release --parallel \
              2>&1 | tee "visual-proof/$label-build.log"

            exe="build/visual-proof/bin/DigitalBreakdown"
            echo "=== EXECUTABLE DIAGNOSTIC $label ===" | tee "visual-proof/$label-capture.log"
            echo "EXE=$exe" | tee -a "visual-proof/$label-capture.log"
            ls -l "$exe" 2>&1 | tee -a "visual-proof/$label-capture.log"
            file "$exe" 2>&1 | tee -a "visual-proof/$label-capture.log"
            test -x "$exe"

            out="$(pwd)/visual-proof/$label"
            mkdir -p "$out"
            echo "OUT=$out" | tee -a "visual-proof/$label-capture.log"
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 640x480x24' \
              "$exe" --capture-cinematic-demo "$out" --capture-width 320 --capture-height 180 --capture-hide-hud \
              2>&1 | tee -a "visual-proof/$label-capture.log"
            count="$(find "$out" -maxdepth 1 -name '*.ppm' | wc -l | tr -d ' ')"
            echo "CAPTURE_COUNT $label=$count" | tee -a "visual-proof/$label-capture.log"
            test "$count" -ge 2
          done <<'REFS'
          A-base 86066c3c20879d2b3cc2b84bfc536869d3dc9a99
          B-sun-contract 4f6f9c0530b75407074e1b56851ef85e377789ef
          C-current-camera b76953e4cf0efa5238a60d3dcace8aa71f16cdc8
          REFS

      - name: Compare frame pixels
        shell: bash
        run: |
          cat > compare_visuals.py <<'PY'
          from pathlib import Path
          import statistics

          root = Path('visual-proof')
          labels = ['A-base', 'B-sun-contract', 'C-current-camera']

          def read_ppm(path):
              data = path.read_bytes()
              if not data.startswith(b'P6'):
                  raise RuntimeError(f'not P6: {path}')
              pos = 2; tokens = []
              while len(tokens) < 3:
                  while pos < len(data) and data[pos] in b' \t\r\n': pos += 1
                  if data[pos:pos+1] == b'#':
                      while pos < len(data) and data[pos] not in b'\r\n': pos += 1
                      continue
                  start = pos
                  while pos < len(data) and data[pos] not in b' \t\r\n': pos += 1
                  tokens.append(data[start:pos])
              while pos < len(data) and data[pos] in b' \t\r\n': pos += 1
              w, h, maxv = map(int, tokens)
              pixels = data[pos:]
              if maxv != 255 or len(pixels) != w*h*3:
                  raise RuntimeError(f'bad ppm payload: {path} {w}x{h} {len(pixels)}')
              return w, h, pixels

          frames = {label: sorted((root/label).glob('*.ppm')) for label in labels}
          counts = {k: len(v) for k,v in frames.items()}
          print('FRAME_COUNTS', counts)
          if len(set(counts.values())) != 1:
              raise SystemExit('frame-count mismatch')

          def compare(left, right):
              maes=[]; changed=[]; maxima=[]; exact=0; rows=[]
              for lp, rp in zip(frames[left], frames[right]):
                  lw,lh,a=read_ppm(lp); rw,rh,b=read_ppm(rp)
                  if (lw,lh)!=(rw,rh): raise SystemExit('dimension mismatch')
                  diffs=[abs(x-y) for x,y in zip(a,b)]
                  mae=sum(diffs)/len(diffs)
                  ch=sum(d != 0 for d in diffs)
                  mx=max(diffs) if diffs else 0
                  if ch==0: exact += 1
                  maes.append(mae); changed.append(ch); maxima.append(mx)
                  rows.append((mae, ch, mx, lp.name))
              rows.sort(reverse=True)
              return {
                  'frames': len(maes), 'exact_frames': exact,
                  'mean_mae': statistics.fmean(maes), 'max_frame_mae': max(maes),
                  'mean_changed_channels': statistics.fmean(changed),
                  'max_channel_delta': max(maxima), 'worst': rows[:10]
              }

          ab=compare('A-base','B-sun-contract')
          bc=compare('B-sun-contract','C-current-camera')
          ac=compare('A-base','C-current-camera')
          print('A_VS_B', ab)
          print('B_VS_C', bc)
          print('A_VS_C', ac)
          (root/'comparison.txt').write_text(
              f'FRAME_COUNTS {counts}\nA_VS_B {ab}\nB_VS_C {bc}\nA_VS_C {ac}\n', encoding='utf-8')

          selected=root/'selected'; selected.mkdir(exist_ok=True)
          worst_names=[row[3] for row in bc['worst'][:6]]
          for label in labels:
              for name in worst_names:
                  src=root/label/name
                  if src.exists(): (selected/f'{label}__{name}').write_bytes(src.read_bytes())
          print('SELECTED_FRAMES', worst_names)
          PY
          python3 compare_visuals.py

      - name: Upload comparison and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lighting-abc-visual-proof
          path: |
            visual-proof/*.log
            visual-proof/comparison.txt
            visual-proof/selected/*.ppm
          if-no-files-found: warn
          retention-days: 7
