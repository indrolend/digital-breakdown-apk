name: Gameplay checks

on:
  pull_request:
    paths:
      - "native-android/app/src/main/cpp/game/**"
      - "native/tests/**"
      - "native-desktop/CMakeLists.txt"
      - "native-desktop/**.cpp"
      - "native-desktop/**.hpp"
      - "native-network/**"
      - "native-models/**"
      - "native-desktop/audio/**"
      - "native-android/app/src/main/res/raw/**"
      - "scripts/verify-gameplay.*"
      - "tools/verify_asset_mirrors.py"
      - ".github/workflows/gameplay-checks.yml"
  push:
    branches:
      - main
      - agent/gameplay-architecture-distillation
      - agent/loose-soul-normalization
      - agent/experimental-release-coherence
      - desktop-lighting-contract-verify
    paths:
      - "native-android/app/src/main/cpp/game/**"
      - "native/tests/**"
      - "native-desktop/CMakeLists.txt"
      - "native-desktop/**.cpp"
      - "native-desktop/**.hpp"
      - "native-network/**"
      - "native-models/**"
      - "native-desktop/audio/**"
      - "native-android/app/src/main/res/raw/**"
      - "scripts/verify-gameplay.*"
      - "tools/verify_asset_mirrors.py"
      - ".github/workflows/gameplay-checks.yml"

permissions:
  contents: write

concurrency:
  group: gameplay-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify platform asset mirrors
        run: python3 tools/verify_asset_mirrors.py
      - name: Verify gameplay contracts
        run: bash scripts/verify-gameplay.sh
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6f58ed0dc250532a479d7789f # v6
        with:
          name: gameplay-verification-logs
          path: build/gameplay-checks/verification-logs
          if-no-files-found: warn
          retention-days: 7

  lighting-contract:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: desktop-lighting-contract-verify
          fetch-depth: 0

      - name: Verify source and branch authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $blob = (git rev-parse 'HEAD:native-desktop/DesktopRenderer.cpp').Trim()
          if ($blob -ne 'f67a9e68806f8ef3a2c16cd4ce7924dae0f7de51') {
            throw "Unexpected DesktopRenderer.cpp blob: $blob"
          }
          git fetch origin desktop-lighting-contract
          $target = (git rev-parse refs/remotes/origin/desktop-lighting-contract).Trim()
          if ($target -ne '86066c3c20879d2b3cc2b84bfc536869d3dc9a99') {
            throw "desktop-lighting-contract drifted to $target"
          }

      - name: Apply canonical scene sun contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import subprocess

          path = Path('native-desktop/DesktopRenderer.cpp')
          data = subprocess.check_output(['git', 'show', 'HEAD:native-desktop/DesktopRenderer.cpp'])
          replacements = [
              (b"constexpr float ROOM_WALL_HEIGHT = 7.2f;\nconstexpr float PI = 3.14159265358979323846f;\n",
               b"constexpr float ROOM_WALL_HEIGHT = 7.2f;\nconstexpr float PI = 3.14159265358979323846f;\nconstexpr Vec3 SCENE_SUN_VECTOR{30.0f, 60.0f, 25.0f};\nconstexpr float SHADOW_PROJECTION_SCALE = 0.5f;\n"),
              (b"    constexpr int segments = 8;\n    const Vec3 center{caster.x-height*0.25f,0.012f,caster.z-height*(25.0f/120.0f)};\n    const float stretch=height*0.16f;\n    const float angle=std::atan2(-0.5f,-25.0f/60.0f);\n",
               b"    constexpr int segments = 8;\n    const float sunXOverY=SCENE_SUN_VECTOR.x/SCENE_SUN_VECTOR.y;\n    const float sunZOverY=SCENE_SUN_VECTOR.z/SCENE_SUN_VECTOR.y;\n    const Vec3 center{\n        caster.x-height*SHADOW_PROJECTION_SCALE*sunXOverY,\n        0.012f,\n        caster.z-height*SHADOW_PROJECTION_SCALE*sunZOverY\n    };\n    const float stretch=height*0.16f;\n    const float angle=std::atan2(-sunXOverY,-sunZOverY);\n"),
              (b"    const GLfloat sunDiffuse[]={1.0f,1.0f,1.0f,1.0f}, sunPos[]={30.0f,60.0f,25.0f,0.0f};\n    glLightfv(GL_LIGHT0,GL_DIFFUSE,sunDiffuse); glLightfv(GL_LIGHT0,GL_POSITION,sunPos);\n",
               b"    const GLfloat sunDiffuse[]={1.0f,1.0f,1.0f,1.0f};\n    const GLfloat sunPos[]={\n        SCENE_SUN_VECTOR.x,\n        SCENE_SUN_VECTOR.y,\n        SCENE_SUN_VECTOR.z,\n        0.0f\n    };\n    glLightfv(GL_LIGHT0,GL_DIFFUSE,sunDiffuse); glLightfv(GL_LIGHT0,GL_POSITION,sunPos);\n"),
          ]
          for old, new in replacements:
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, found {count}')
              data = data.replace(old, new, 1)
          path.write_bytes(data)
          '@ | python -
          $owned = @(git diff --name-only -- native-desktop/DesktopRenderer.cpp)
          if ($owned.Count -ne 1 -or $owned[0] -ne 'native-desktop/DesktopRenderer.cpp') {
            throw "Renderer diff missing or unexpected: $($owned -join ', ')"
          }
          git diff --check -- native-desktop/DesktopRenderer.cpp
          git diff --stat -- native-desktop/DesktopRenderer.cpp
          git diff -- native-desktop/DesktopRenderer.cpp

      - name: Configure desktop release
        run: >-
          cmake -S native-desktop -B build/desktop-release -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DDB_COMMIT_SHA="86066c3c20879d2b3cc2b84bfc536869d3dc9a99"
          -DDB_CHANNEL=lighting-contract-verify
          -DDB_HUMAN_VERSION="lighting-contract-verify"

      - name: Build desktop release
        run: cmake --build build/desktop-release --config Release --parallel

      - name: Run Windows regression tests
        run: ctest --test-dir build/desktop-release -C Release --output-on-failure

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'build/desktop-release/bin/Release/DigitalBreakdown.exe',
            'build/desktop-release/bin/DigitalBreakdown.exe'
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw 'DigitalBreakdown.exe was not produced.' }
          $output = & $exe --smoke-test 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Desktop smoke test exited with $LASTEXITCODE." }
          if (($output -join "`n") -notmatch 'SMOKE_TEST_OK') {
            throw 'Desktop smoke test did not produce its success marker.'
          }

      - name: Publish one clean renderer commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patched = Join-Path $env:RUNNER_TEMP 'DesktopRenderer.cpp'
          Copy-Item native-desktop/DesktopRenderer.cpp $patched
          git switch --detach 86066c3c20879d2b3cc2b84bfc536869d3dc9a99
          Copy-Item $patched native-desktop/DesktopRenderer.cpp
          git add -- native-desktop/DesktopRenderer.cpp
          git diff --cached --check -- native-desktop/DesktopRenderer.cpp
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne 'native-desktop/DesktopRenderer.cpp') {
            throw "Unexpected staged paths: $($staged -join ', ')"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify desktop sun and shadow direction'
          $clean = (git rev-parse HEAD).Trim()
          git push origin "$clean`:refs/heads/desktop-lighting-contract"
          "CLEAN_COMMIT=$clean" | Write-Host
