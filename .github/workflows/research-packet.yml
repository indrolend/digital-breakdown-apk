name: Build Research Packet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-packet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Build current-source research packet
        run: python3 tools/make_research_packet.py

      - name: Upload packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digital-breakdown-runtime-research-${{ github.sha }}
          path: dist/digital-breakdown-runtime-research.zip
          if-no-files-found: error
          retention-days: 30
