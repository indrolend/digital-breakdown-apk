name: Build Research Packet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 20

      - name: Build current-source research packet
        run: python3 tools/make_research_packet.py

      - name: Upload packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digital-breakdown-runtime-research-${{ github.sha }}
          path: dist/digital-breakdown-runtime-research.zip
          if-no-files-found: error
          retention-days: 30
