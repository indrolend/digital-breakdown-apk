name: Windows Release Candidate

on:
  pull_request:
    paths:
      - 'native-desktop/**'
      - 'native-android/app/src/main/cpp/game/**'
      - 'native-network/**'
      - 'native-models/**'
      - 'tools/verify_asset_mirrors.py'
      - 'tools/desktop/**'
      - 'tools/release/**'
      - 'distribution/**'
      - '.github/workflows/windows-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and prove Windows candidate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify platform asset mirrors
        run: python tools/verify_asset_mirrors.py

      - name: Check protocol declarations
        run: node tools/release/protocol-consistency.mjs

      - name: Configure desktop release
        run: >-
          cmake -S native-desktop -B build/desktop-release -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DDB_COMMIT_SHA="${{ env.SOURCE_SHA }}"
          -DDB_CHANNEL=pr-candidate
          -DDB_HUMAN_VERSION="pr-candidate-${{ env.SOURCE_SHA }}"

      - name: Build desktop release
        run: cmake --build build/desktop-release --config Release --parallel

      - name: Run Windows regression tests
        run: ctest --test-dir build/desktop-release -C Release --output-on-failure

      - name: Stage, inspect, package, and smoke-test candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ env.SOURCE_SHA }}'
          if ($sha -notmatch '^[0-9a-fA-F]{40}$' -or $sha -eq ('0' * 40)) {
            throw "Candidate source provenance is unusable: '$sha'."
          }

          $runtimeCandidates = @(
            'build/desktop-release/bin/Release',
            'build/desktop-release/bin'
          )
          $runtime = $runtimeCandidates | Where-Object {
            Test-Path (Join-Path $_ 'DigitalBreakdown.exe')
          } | Select-Object -First 1
          if (-not $runtime) { throw 'DigitalBreakdown.exe was not produced.' }

          $buildTreeExe = Join-Path $runtime 'DigitalBreakdown.exe'
          $buildOutput = & $buildTreeExe --smoke-test 2>&1
          $buildOutput | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($buildOutput -join "`n") -notmatch 'SMOKE_TEST_OK') {
            throw 'Build-tree smoke test failed.'
          }
          'WINDOWS_SMOKE_BUILD_TREE=PASS' | Write-Host

          $stage = 'dist/windows/DigitalBreakdown'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $runtime '*') $stage -Recurse -Force

          @('DigitalBreakdown.exe', 'audio', 'fonts', 'models', 'tv-gifs') | ForEach-Object {
            if (-not (Test-Path (Join-Path $stage $_))) {
              throw "Staged runtime is incomplete: missing $_."
            }
          }
          'WINDOWS_STAGE_COMPLETE=PASS' | Write-Host

          $exe = Join-Path $stage 'DigitalBreakdown.exe'
          $llvmReadObj = Get-Command llvm-readobj -ErrorAction SilentlyContinue
          if ($llvmReadObj) {
            $imports = & $llvmReadObj.Source --coff-imports $exe 2>&1
          } else {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            if (-not (Test-Path $vswhere)) { throw 'No deterministic PE import inspector is available.' }
            $dumpbin = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
              Select-Object -First 1
            if (-not $dumpbin) { throw 'dumpbin.exe was not found.' }
            $imports = & $dumpbin /dependents $exe 2>&1
          }
          $imports | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "PE import inspection exited with $LASTEXITCODE." }
          $forbiddenRuntime = '(?i)\b(?:MSVCP\d+D?|VCRUNTIME\d+(?:_\d+)?D?|UCRTBASED)\.dll\b'
          $matches = [regex]::Matches(($imports -join "`n"), $forbiddenRuntime) |
            ForEach-Object Value | Sort-Object -Unique
          if ($matches) {
            throw "Executable dynamically imports forbidden MSVC runtime DLLs: $($matches -join ', ')."
          }
          'WINDOWS_MSVC_PORTABILITY=PASS' | Write-Host

          @{
            schemaVersion = 1
            project = 'DATA'
            displayName = 'Digital Breakdown'
            creator = 'indrolend'
            commit = $sha
            shortCommit = $sha.Substring(0, 7)
            platform = 'windows-x64'
            configuration = 'Release'
            portable = $true
            workflow = '${{ github.workflow }}'
            runId = '${{ github.run_id }}'
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content "$stage/build-info.json" -Encoding UTF8

          $zip = 'dist/DigitalBreakdown-Windows.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Windows ZIP was not created.' }

          $extract = Join-Path $env:RUNNER_TEMP "digital-breakdown-extracted-${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $extractedExe = Join-Path $extract 'DigitalBreakdown/DigitalBreakdown.exe'
          if (-not (Test-Path $extractedExe)) { throw 'Extracted Windows executable is missing.' }

          Push-Location (Split-Path $extractedExe)
          try {
            $output = & '.\DigitalBreakdown.exe' --smoke-test 2>&1
            $smokeExitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          $output | Write-Host
          if ($smokeExitCode -ne 0 -or ($output -join "`n") -notmatch 'SMOKE_TEST_OK') {
            throw "Extracted candidate smoke test failed with exit code $smokeExitCode."
          }
          'WINDOWS_SMOKE_EXTRACTED=PASS' | Write-Host

          $zipSha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($zipSha -notmatch '^[0-9a-f]{64}$') { throw 'Windows ZIP SHA-256 is invalid.' }
          $zipSha | Set-Content 'dist/DigitalBreakdown-Windows.zip.sha256' -Encoding ascii
          "WINDOWS_SHA256=$zipSha" | Write-Host

      - name: Upload exact Windows candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release-candidate
          path: |
            dist/DigitalBreakdown-Windows.zip
            dist/DigitalBreakdown-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30
