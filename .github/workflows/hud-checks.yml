name: CommandHUD integration check

on:
  pull_request:
    paths:
      - "distribution/project.json"
      - "tools/commandhud-project.test.mjs"
      - "CommandHUD*.cmd"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hud-checks.yml"
  push:
    branches: [main]
    paths:
      - "distribution/project.json"
      - "tools/commandhud-project.test.mjs"
      - "CommandHUD*.cmd"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hud-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commandhud-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify DATA CommandHUD integration
        run: npm run hud:check
