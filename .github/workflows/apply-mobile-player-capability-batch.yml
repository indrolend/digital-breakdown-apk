name: Apply mobile player capability batch

on:
  push:
    branches:
      - agent/ownership-contracts-settings
    paths:
      - .github/workflows/apply-mobile-player-capability-batch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ownership-contracts-settings
          fetch-depth: 0
      - name: Apply deterministic capability batch
        run: python3 tools/apply_mobile_player_capability_batch.py
      - name: Verify native gameplay contracts
        run: bash scripts/verify-gameplay.sh
      - name: Verify native and Worker protocol agreement
        run: node tools/release/protocol-consistency.mjs
      - name: Verify Worker protocol and relay
        working-directory: multiplayer-server
        run: |
          npm ci
          npm test
      - name: Commit capability batch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/app/src/main/cpp/game/Game.hpp \
                  native-android/app/src/main/cpp/game/Game.cpp \
                  native-android/app/src/main/cpp/native_bridge.cpp \
                  native-network/MultiplayerProtocol.hpp \
                  native-network/MultiplayerProtocol.cpp \
                  multiplayer-server/src/protocol.ts \
                  native/tests/multiplayer_protocol_test.cpp \
                  native/tests/mobile_framing_remote_authority_test.cpp
          git commit -m "Scope mobile action assist per player"
          git push origin HEAD:agent/ownership-contracts-settings
