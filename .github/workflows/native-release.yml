name: Desktop Release Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['native-desktop/**', 'native-android/app/src/main/cpp/game/**', 'native-network/**', 'multiplayer-server/src/protocol.ts', 'native-models/**', 'native-tv-gifs/**', 'tools/release/**', '.github/workflows/native-release.yml']
  push:
    branches: [main]
    paths: ['native-desktop/**', 'native-android/app/src/main/cpp/game/**', 'native-network/**', 'multiplayer-server/src/protocol.ts', 'native-models/**', 'native-tv-gifs/**', 'tools/release/**', '.github/workflows/native-release.yml']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 artifact
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify inputs
        run: |
          python tools/verify_asset_mirrors.py
          node tools/release/protocol-consistency.mjs
      - name: Configure, build, and test
        run: |
          cmake -S native-desktop -B build/release -A x64 -DCMAKE_BUILD_TYPE=Release -DDB_COMMIT_SHA="${{ github.sha }}" -DDB_CHANNEL=desktop-candidate -DDB_HUMAN_VERSION="desktop-candidate-${{ github.sha }}" -DDB_STOREFRONT_RELEASE=ON -DDB_ENABLE_DEVELOPER_CONSOLE=OFF
          cmake --build build/release --config Release --parallel
          ctest --test-dir build/release -C Release --output-on-failure
      - name: Stage, audit, and smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build/release --config Release --prefix dist/windows
          $stage = 'dist/windows/DigitalBreakdown'
          @('DigitalBreakdown.exe','audio','fonts','models','tv-gifs') | ForEach-Object { if (-not (Test-Path (Join-Path $stage $_))) { throw "Missing $_" } }
          $exe = Join-Path $stage 'DigitalBreakdown.exe'
          $smoke = & $exe --smoke-test 2>&1
          if ($LASTEXITCODE -ne 0 -or ($smoke -join "`n") -notmatch 'SMOKE_TEST_OK') { throw 'Staged smoke failed.' }
          $identity = & $exe --build-identity-json 2>&1
          if (($identity -join "`n") -notmatch '${{ github.sha }}') { throw 'Embedded identity mismatch.' }
          $identityObject = $identity | ConvertFrom-Json
          if (-not $identityObject.storefront_release -or $identityObject.developer_console) { throw 'Release profile mismatch.' }
          $models = & $exe --model-test 2>&1
          if ($LASTEXITCODE -ne 0 -or ($models -join "`n") -notmatch 'MODEL_TEST_OK') { throw 'Staged asset decode failed.' }
          node tools/release/write-desktop-build-info.mjs --output "$stage/build-info.json" --platform windows --architecture x64 --commit "${{ github.sha }}" --portable true
          $llvm = Get-Command llvm-readobj -ErrorAction SilentlyContinue
          if ($llvm) {
            $imports = & $llvm.Source --coff-imports $exe 2>&1
          } else {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path -LiteralPath $vswhere)) { throw 'No PE dependency inspection tool is available.' }
            $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $dumpbin = Get-ChildItem -LiteralPath "$visualStudio\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Select-Object -First 1
            if (-not $dumpbin) { throw 'No PE dependency inspection tool is available.' }
            $imports = & $dumpbin.FullName /DEPENDENTS $exe 2>&1
          }
          if ($LASTEXITCODE -ne 0) { throw 'PE audit failed.' }
          $forbidden = [regex]::Matches(($imports -join "`n"), '(?i)\b(?:MSVCP\d+D?|VCRUNTIME\d+(?:_\d+)?D?|UCRTBASED)\.dll\b')
          if ($forbidden.Count) { throw 'Forbidden debug/runtime DLL import.' }
          Compress-Archive -Path $stage -DestinationPath dist/DigitalBreakdown-Windows.zip -Force
          $extract = Join-Path $env:RUNNER_TEMP 'db-windows'
          Expand-Archive dist/DigitalBreakdown-Windows.zip $extract -Force
          $smoke = & "$extract/DigitalBreakdown/DigitalBreakdown.exe" --smoke-test 2>&1
          if ($LASTEXITCODE -ne 0 -or ($smoke -join "`n") -notmatch 'SMOKE_TEST_OK') { throw 'Extracted smoke failed.' }
          $models = & "$extract/DigitalBreakdown/DigitalBreakdown.exe" --model-test 2>&1
          if ($LASTEXITCODE -ne 0 -or ($models -join "`n") -notmatch 'MODEL_TEST_OK') { throw 'Extracted asset decode failed.' }
          'WINDOWS_STAGE_COMPLETE=PASS'; 'WINDOWS_DEPENDENCIES=PASS'; 'WINDOWS_SMOKE_EXTRACTED=PASS'; 'WINDOWS_ASSETS_EXTRACTED=PASS'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-windows-x64
          path: dist/DigitalBreakdown-Windows.zip
          if-no-files-found: error

  macos:
    name: macOS universal app
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify inputs
        run: |
          python3 tools/verify_asset_mirrors.py
          node tools/release/protocol-consistency.mjs
      - name: Configure, build, and test
        run: |
          cmake -S native-desktop -B build/release -DCMAKE_BUILD_TYPE=Release -DDB_COMMIT_SHA="${{ github.sha }}" -DDB_CHANNEL=desktop-candidate -DDB_HUMAN_VERSION="desktop-candidate-${{ github.sha }}" -DDB_STOREFRONT_RELEASE=ON -DDB_ENABLE_DEVELOPER_CONSOLE=OFF -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/release --config Release --parallel
          ctest --test-dir build/release -C Release --output-on-failure
      - name: Stage, audit, and smoke
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/release --config Release --prefix dist/macos
          APP="dist/macos/DigitalBreakdown.app"; EXE="$APP/Contents/MacOS/DigitalBreakdown"
          test -x "$EXE"; plutil -lint "$APP/Contents/Info.plist"
          for asset in audio fonts models tv-gifs; do test -d "$APP/Contents/Resources/$asset"; done
          file "$EXE" | tee dist/macos-binary.txt
          grep -q x86_64 dist/macos-binary.txt; grep -q arm64 dist/macos-binary.txt
          otool -L "$EXE" | tee dist/macos-dependencies.txt
          node tools/release/write-desktop-build-info.mjs --output "$APP/Contents/Resources/build-info.json" --platform macos --architecture universal --commit "${{ github.sha }}" --portable false
          IDENTITY=$("$EXE" --build-identity-json)
          echo "$IDENTITY" | grep -q "${{ github.sha }}"
          echo "$IDENTITY" | grep -q '"storefront_release":true'
          echo "$IDENTITY" | grep -q '"developer_console":false'
          "$EXE" --smoke-test | grep -q SMOKE_TEST_OK
          "$EXE" --model-test | grep -q MODEL_TEST_OK
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/DigitalBreakdown-macOS-Universal.zip
          mkdir -p "$RUNNER_TEMP/db-macos"
          ditto -x -k dist/DigitalBreakdown-macOS-Universal.zip "$RUNNER_TEMP/db-macos"
          "$RUNNER_TEMP/db-macos/DigitalBreakdown.app/Contents/MacOS/DigitalBreakdown" --smoke-test | grep -q SMOKE_TEST_OK
          "$RUNNER_TEMP/db-macos/DigitalBreakdown.app/Contents/MacOS/DigitalBreakdown" --model-test | grep -q MODEL_TEST_OK
          echo MACOS_STAGE_COMPLETE=PASS; echo MACOS_DEPENDENCIES=PASS; echo MACOS_SMOKE_EXTRACTED=PASS; echo MACOS_ASSETS_EXTRACTED=PASS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-macos-universal
          path: dist/DigitalBreakdown-macOS-Universal.zip
          if-no-files-found: error

  linux:
    name: Linux x86-64 artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libssl-dev
      - name: Verify inputs
        run: |
          python3 tools/verify_asset_mirrors.py
          node tools/release/protocol-consistency.mjs
      - name: Configure, build, and test
        run: |
          cmake -S native-desktop -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DDB_COMMIT_SHA="${{ github.sha }}" -DDB_CHANNEL=desktop-candidate -DDB_HUMAN_VERSION="desktop-candidate-${{ github.sha }}" -DDB_STOREFRONT_RELEASE=ON -DDB_ENABLE_DEVELOPER_CONSOLE=OFF
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure
      - name: Stage, audit, and smoke
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/release --prefix dist/linux
          STAGE="dist/linux/DigitalBreakdown"; EXE="$STAGE/DigitalBreakdown"
          test -x "$EXE"
          for asset in audio fonts models tv-gifs; do test -d "$STAGE/$asset"; done
          file "$EXE" | tee dist/linux-binary.txt
          grep -Eq 'ELF 64-bit.*x86-64' dist/linux-binary.txt
          ldd "$EXE" | tee dist/linux-dependencies.txt
          ! grep -q 'not found' dist/linux-dependencies.txt
          node tools/release/write-desktop-build-info.mjs --output "$STAGE/build-info.json" --platform linux --architecture x64 --commit "${{ github.sha }}" --portable true
          IDENTITY=$("$EXE" --build-identity-json)
          echo "$IDENTITY" | grep -q "${{ github.sha }}"
          echo "$IDENTITY" | grep -q '"storefront_release":true'
          echo "$IDENTITY" | grep -q '"developer_console":false'
          "$EXE" --smoke-test | grep -q SMOKE_TEST_OK
          "$EXE" --model-test | grep -q MODEL_TEST_OK
          tar -C dist/linux -czf dist/DigitalBreakdown-Linux-x86_64.tar.gz DigitalBreakdown
          mkdir -p "$RUNNER_TEMP/db-linux"
          tar -C "$RUNNER_TEMP/db-linux" -xzf dist/DigitalBreakdown-Linux-x86_64.tar.gz
          "$RUNNER_TEMP/db-linux/DigitalBreakdown/DigitalBreakdown" --smoke-test | grep -q SMOKE_TEST_OK
          "$RUNNER_TEMP/db-linux/DigitalBreakdown/DigitalBreakdown" --model-test | grep -q MODEL_TEST_OK
          echo LINUX_STAGE_COMPLETE=PASS; echo LINUX_DEPENDENCIES=PASS; echo LINUX_SMOKE_EXTRACTED=PASS; echo LINUX_ASSETS_EXTRACTED=PASS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-linux-x86-64
          path: dist/DigitalBreakdown-Linux-x86_64.tar.gz
          if-no-files-found: error

  contract:
    name: Three-platform artifact contract
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: downloaded
      - name: Verify unified contract
        run: |
          mkdir -p release
          find downloaded -type f -name 'DigitalBreakdown-Windows.zip' -exec cp {} release/ \;
          find downloaded -type f -name 'DigitalBreakdown-macOS-Universal.zip' -exec cp {} release/ \;
          find downloaded -type f -name 'DigitalBreakdown-Linux-x86_64.tar.gz' -exec cp {} release/ \;
          GITHUB_SHA="${{ github.sha }}" DB_HUMAN_VERSION="desktop-candidate-${{ github.sha }}" node tools/release/write-native-manifest.mjs release
          node tools/release/verify-native-manifest.mjs release/build-manifest.json release
          echo DESKTOP_ARTIFACT_CONTRACT=PASS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-release-contract
          path: release
          if-no-files-found: error
