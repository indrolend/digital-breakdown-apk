name: Package Native Builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-check:
    name: Verify multiplayer backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplayer-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: multiplayer-server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:dry

  windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native-desktop -B build/windows -A x64 -DCMAKE_BUILD_TYPE=Release -DDIGITAL_BREAKDOWN_BUILD_NUMBER=${{ github.run_number }} -DDIGITAL_BREAKDOWN_SOURCE_COMMIT=${{ github.sha }}
      - run: cmake --build build/windows --config Release --parallel
      - name: Test and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(
            'build/windows/bin/Release/DigitalBreakdown.exe',
            'build/windows/bin/DigitalBreakdown.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw 'DigitalBreakdown.exe was not produced.' }
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Desktop smoke test failed.' }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item $exe dist/windows/DigitalBreakdown.exe
          Copy-Item version.json dist/windows/version.json
          Compress-Archive -Path dist/windows/* -DestinationPath dist/DigitalBreakdown-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: digital-breakdown-windows-${{ github.run_number }}
          path: dist/DigitalBreakdown-Windows.zip
          if-no-files-found: error
          retention-days: 30

  android:
    name: Package Android test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - run: echo "sdk.dir=$ANDROID_HOME" > native-android/local.properties
      - run: ./android/gradlew -p native-android assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=native-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -q 'lib/armeabi-v7a/libdigitalbreakdown.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libdigitalbreakdown.so' apk-contents.txt
          cp "$APK" DigitalBreakdown-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: digital-breakdown-android-${{ github.run_number }}
          path: |
            DigitalBreakdown-Android-debug.apk
            apk-contents.txt
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Package unsigned macOS test build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S native-desktop -B build/macos
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DDIGITAL_BREAKDOWN_BUILD_NUMBER=${{ github.run_number }}
          -DDIGITAL_BREAKDOWN_SOURCE_COMMIT=${{ github.sha }}
      - run: cmake --build build/macos --config Release --parallel
      - run: |
          set -euo pipefail
          build/macos/Pass7ParityTest
          build/macos/MultiplayerProtocolTest
          APP=build/macos/bin/DigitalBreakdown.app
          test -x "$APP/Contents/MacOS/DigitalBreakdown"
          file "$APP/Contents/MacOS/DigitalBreakdown" | tee macos-binary.txt
          grep -q x86_64 macos-binary.txt
          grep -q arm64 macos-binary.txt
          ditto -c -k --sequesterRsrc --keepParent "$APP" DigitalBreakdown-macOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: digital-breakdown-macos-${{ github.run_number }}
          path: |
            DigitalBreakdown-macOS-unsigned.zip
            macos-binary.txt
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Record package identity
    needs: [backend-check, windows, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write package record
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('version.json', encoding='utf-8'))
          record = {
              'gameVersion': version['gameVersion'],
              'releaseStage': version['releaseStage'],
              'protocolVersion': version['protocolVersion'],
              'buildNumber': int(os.environ['GITHUB_RUN_NUMBER']),
              'commit': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'purpose': 'manually requested test packages',
              'publicRelease': False,
          }
          json.dump(record, open('package-record.json', 'w', encoding='utf-8'), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: digital-breakdown-package-record-${{ github.run_number }}
          path: package-record.json
          if-no-files-found: error
          retention-days: 90
