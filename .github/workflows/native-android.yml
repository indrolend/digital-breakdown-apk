name: Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - 'native-models/**'
      - 'native-desktop/audio/**'
      - 'tools/verify_asset_mirrors.py'
      - '.github/workflows/native-android.yml'
      - 'scripts/native-android.sh'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'native-android/**'
      - 'native-models/**'
      - 'native-desktop/audio/**'
      - 'tools/verify_asset_mirrors.py'
      - '.github/workflows/native-android.yml'
      - 'scripts/native-android.sh'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify platform asset mirrors
        run: python3 tools/verify_asset_mirrors.py

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > native-android/local.properties

      - name: Build native debug APK
        run: |
          ./android/gradlew -p native-android assembleDebug --stacktrace \
            -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="0.1-native.${GITHUB_RUN_NUMBER}"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp native-android/app/build/outputs/apk/debug/app-debug.apk artifact/digital-breakdown-native-debug.apk
          git rev-parse HEAD > artifact/commit-sha.txt
          cat > artifact/build-info.txt <<EOF
          app_id=com.indrolend.digitalbreakdown.native
          variant=debug
          abi=armeabi-v7a,arm64-v8a
          workflow=${{ github.workflow }}
          run_id=${{ github.run_id }}
          sha=${{ github.sha }}
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digital-breakdown-native-debug-apk
          path: artifact/
          retention-days: 14
