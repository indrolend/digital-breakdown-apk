name: Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
      - 'scripts/native-android.sh'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'
      - 'scripts/native-android.sh'
      - 'package.json'
  workflow_dispatch:

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify platform asset mirrors
        run: python3 tools/verify_asset_mirrors.py

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > native-android/local.properties

      - name: Build native debug APK
        run: |
          ./android/gradlew -p native-android assembleDebug --stacktrace \
            -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="0.1-native.${GITHUB_RUN_NUMBER}"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp native-android/app/build/outputs/apk/debug/app-debug.apk artifact/digital-breakdown-native-debug.apk
          git rev-parse HEAD > artifact/commit-sha.txt
          cat > artifact/build-info.txt <<EOF
          app_id=com.indrolend.digitalbreakdown.native
          variant=debug
          abi=armeabi-v7a,arm64-v8a
          workflow=${{ github.workflow }}
          run_id=${{ github.run_id }}
          sha=${{ github.sha }}
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digital-breakdown-native-debug-apk
          path: artifact/
          retention-days: 14
