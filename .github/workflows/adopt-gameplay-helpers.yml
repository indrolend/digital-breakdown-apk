name: Adopt gameplay helpers

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/gameplay-architecture-distillation

permissions:
  contents: write

jobs:
  adopt:
    if: github.event.pull_request.head.ref == 'agent/loose-soul-normalization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded gameplay adoption
        run: python3 tools/apply_gameplay_role_adoption.py --write

      - name: Verify gameplay
        continue-on-error: true
        run: bash scripts/verify-gameplay.sh

      - name: Commit runtime adoption
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/app/src/main/cpp/game/Game.cpp
          git commit -m "Adopt target roles and loose soul motion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
