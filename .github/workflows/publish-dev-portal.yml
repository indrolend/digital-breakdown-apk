name: Publish Dev Portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-android/**'
      - 'native-web/**'
      - 'www/**'
      - 'tools/make_research_packet.py'
      - 'research/**'
      - '.github/workflows/publish-dev-portal.yml'

permissions:
  contents: read

concurrency:
  group: publish-dev-portal-${{ github.ref }}
  cancel-in-progress: true

env:
  PORTAL_REPOSITORY: indrolend/Digital-breakdown-dev
  PORTAL_TOKEN: ${{ secrets.DEV_PORTAL_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out authoritative game source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_HOME" > native-android/local.properties

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: '3.1.73'
          actions-cache-folder: emsdk-cache

      - name: Prepare persistent APK signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/digital-breakdown-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "apk=native-android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "Persistent signing is not configured; publishing a debug-signed APK."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "apk=native-android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native Android APK
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.variant }}" = "release" ]; then
            ./android/gradlew -p native-android assembleRelease --stacktrace \
              -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="0.1-native.${GITHUB_RUN_NUMBER}"
          else
            ./android/gradlew -p native-android assembleDebug --stacktrace \
              -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="0.1-native.${GITHUB_RUN_NUMBER}"
          fi

      - name: Build native WebAssembly runtime
        shell: bash
        run: |
          set -euo pipefail
          emcmake cmake \
            -S native-android/app/src/main/cpp \
            -B build/native-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DDIGITAL_BREAKDOWN_SOURCE_COMMIT="$GITHUB_SHA"
          cmake --build build/native-web --parallel
          mkdir -p dist/native-web
          cp native-web/index.html dist/native-web/index.html
          cp build/native-web/digital-breakdown.js dist/native-web/digital-breakdown.js
          cp build/native-web/digital-breakdown.wasm dist/native-web/digital-breakdown.wasm
          printf '%s\n' "$GITHUB_SHA" > dist/native-web/source-commit.txt

      - name: Build downloadable outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reference
          cp "${{ steps.signing.outputs.apk }}" dist/DigitalBreakdown-Android.apk
          cp -a www/. dist/reference/

          python3 tools/make_research_packet.py
          cp dist/digital-breakdown-runtime-research.zip dist/DigitalBreakdown-Research.zip

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          def zip_tree(source, output):
              source = Path(source)
              with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
                  for path in sorted(source.rglob('*')):
                      if path.is_file():
                          archive.write(path, path.relative_to(source))

          zip_tree('dist/native-web', 'dist/DigitalBreakdown-Native-Web.zip')
          zip_tree('dist/reference', 'dist/DigitalBreakdown-Reference-Web.zip')
          PY

          sha256sum dist/DigitalBreakdown-Android.apk > dist/DigitalBreakdown-Android.apk.sha256
          sha256sum dist/DigitalBreakdown-Native-Web.zip > dist/DigitalBreakdown-Native-Web.zip.sha256
          sha256sum dist/DigitalBreakdown-Reference-Web.zip > dist/DigitalBreakdown-Reference-Web.zip.sha256
          sha256sum dist/DigitalBreakdown-Research.zip > dist/DigitalBreakdown-Research.zip.sha256

      - name: Generate build manifest
        shell: bash
        env:
          ANDROID_VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def file_info(path):
              p = Path(path)
              return {
                  "available": True,
                  "filename": p.name,
                  "size": p.stat().st_size,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              }

          sha = os.environ["GITHUB_SHA"]
          android = file_info("dist/DigitalBreakdown-Android.apk")
          android["variant"] = os.environ.get("ANDROID_VARIANT", "debug")
          android["stableSigning"] = android["variant"] == "release"

          manifest = {
              "schemaVersion": 2,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ.get("GITHUB_REF_NAME", "main"),
              "commit": sha,
              "shortCommit": sha[:7],
              "builtAt": datetime.now(timezone.utc).isoformat(),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "sourceMessage": "Android APK and native WebAssembly runtime were built from the same native commit.",
              "android": android,
              "web": {
                  **file_info("dist/DigitalBreakdown-Native-Web.zip"),
                  "runtime": "native-cpp-wasm",
                  "playPath": "./play/"
              },
              "reference": {
                  **file_info("dist/DigitalBreakdown-Reference-Web.zip"),
                  "runtime": "javascript-reference",
                  "playPath": "./reference/"
              },
              "research": file_info("dist/DigitalBreakdown-Research.zip"),
          }
          Path("dist/build-info.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload source-repository artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digital-breakdown-dev-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Check portal publishing credential
        id: portal-token
        shell: bash
        run: |
          if [ -n "$PORTAL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DEV_PORTAL_TOKEN is not configured; build artifact was created but the portal was not updated."
          fi

      - name: Check out dev portal
        if: steps.portal-token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PORTAL_REPOSITORY }}
          token: ${{ env.PORTAL_TOKEN }}
          path: portal

      - name: Update native web build, reference build, and manifest
        if: steps.portal-token.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portal/play portal/reference
          mkdir -p portal/play portal/reference
          cp -a dist/native-web/. portal/play/
          cp -a dist/reference/. portal/reference/
          cp dist/build-info.json portal/build-info.json

          cd portal
          git config user.name "digital-breakdown-bot"
          git config user.email "actions@users.noreply.github.com"
          git add play reference build-info.json

          if git diff --cached --quiet; then
            echo "Portal content is already current."
          else
            git commit -m "Publish native and reference builds ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi

      - name: Publish rolling download release
        if: steps.portal-token.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ env.PORTAL_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh release view latest-dev --repo "$PORTAL_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest-dev \
              --repo "$PORTAL_REPOSITORY" \
              --title "Latest Development Build" \
              --notes "Rolling personal development build. Exact source revision is recorded in build-info.json."
          fi

          gh release upload latest-dev \
            dist/DigitalBreakdown-Android.apk \
            dist/DigitalBreakdown-Android.apk.sha256 \
            dist/DigitalBreakdown-Native-Web.zip \
            dist/DigitalBreakdown-Native-Web.zip.sha256 \
            dist/DigitalBreakdown-Reference-Web.zip \
            dist/DigitalBreakdown-Reference-Web.zip.sha256 \
            dist/DigitalBreakdown-Research.zip \
            dist/DigitalBreakdown-Research.zip.sha256 \
            dist/build-info.json \
            --repo "$PORTAL_REPOSITORY" \
            --clobber

          gh release edit latest-dev \
            --repo "$PORTAL_REPOSITORY" \
            --title "Latest Development Build · ${GITHUB_SHA::7}" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC'). Android and native WebAssembly share this commit. Android variant: ${{ steps.signing.outputs.variant }}."
