name: Extract cleared-room transaction

on:
  push:
    branches:
      - agent/ownership-contracts-settings
    paths:
      - .github/workflows/extract-cleared-room-transaction.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ownership-contracts-settings
          fetch-depth: 0
      - name: Extract characterized transition policy
        run: python3 tools/extract_cleared_room_transaction.py
      - name: Verify gameplay and room progression
        run: bash scripts/verify-gameplay.sh
      - name: Commit extracted transaction
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/app/src/main/cpp/game/Game.cpp \
                  native-android/app/src/main/cpp/game/Game.hpp
          git commit -m "Name cleared-room advancement transaction"
          git push origin HEAD:agent/ownership-contracts-settings
